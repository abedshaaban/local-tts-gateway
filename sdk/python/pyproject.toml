[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-speech-gateway"
version = "0.1.0"
description = "Python client for Local Speech Gateway"
requires-python = ">=3.10"
dependencies = ["websockets>=12"]

[tool.setuptools.packages.find]
where = ["."]
include = ["local_speech_gateway*", "local_tts_gateway*"]
